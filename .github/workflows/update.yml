name: Update version
on:
  repository_dispatch:
    types:
      - pact-cli-released
      - pact-verifier-cli-released
      - pact-broker-cli-released
      - pact-stub-cli-released
      - pact-plugin-cli-released
      - pact-mock-cli-released
      - pact-standalone-released
  workflow_dispatch:
    inputs:
      type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - pact-cli-released
          - pact-verifier-cli-released
          - pact-broker-cli-released
          - pact-stub-cli-released
          - pact-plugin-cli-released
          - pact-mock-cli-released
          - pact-standalone-released
      version:
        description: 'Release tag to update to (e.g. v0.10.8, pact_mock_server_cli-v2.0.1)'
        required: true
        type: string

jobs:
  release:
    name: Release update
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set script to run based on type of dispatch
        id: set-script
        shell: bash
        env:
          # Release workflows send `tag` (the full release tag); older
          # dispatches and manual runs send `version`.
          TYPE: ${{ github.event.client_payload.type || github.event.inputs.type }}
          VERSION: ${{ github.event.client_payload.tag || github.event.client_payload.version || github.event.inputs.version }}
        run: |
          case "$TYPE" in
            pact-cli-released)
              echo "TOOL_NAME=pact-cli" >> $GITHUB_ENV
              ;;
            pact-broker-cli-released)
              echo "TOOL_NAME=pact-broker-cli" >> $GITHUB_ENV
              ;;
            pact-verifier-cli-released)
              echo "TOOL_NAME=pact_verifier_cli" >> $GITHUB_ENV
              ;;
            pact-stub-cli-released)
              echo "TOOL_NAME=pact-stub-server" >> $GITHUB_ENV
              ;;
            pact-plugin-cli-released)
              echo "TOOL_NAME=pact-plugin-cli" >> $GITHUB_ENV
              ;;
            pact-mock-cli-released)
              echo "TOOL_NAME=pact_mock_server_cli" >> $GITHUB_ENV
              ;;
            pact-standalone-released)
              echo "TOOL_NAME=pact-legacy" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown type: $TYPE"
              exit 1
              ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          RELEASE_VERSION="${VERSION##*-v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> $GITHUB_ENV

      - name: Run update script
        shell: bash
        run: |
          ./scripts/create_bucket.sh "$VERSION"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CREATE_PR: true

      - name: Create PR for version update
        id: create-pr
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "$TOOL_NAME manifest is already at $RELEASE_VERSION; no PR needed"
            exit 0
          fi
          BRANCH="$TOOL_NAME/version/$RELEASE_VERSION"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          git config pull.ff only
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore(release): Update $TOOL_NAME version to $RELEASE_VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create --title "chore(release): Update $TOOL_NAME version to $RELEASE_VERSION" --fill
          echo "🎉 Done!"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
