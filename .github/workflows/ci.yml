name: Tests

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:

jobs:
  test_powershell:
    name: WindowsPowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          fetch-depth: 2
          path: my_bucket
      - name: Checkout Scoop
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Init Test Suite
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers
          shell: powershell
      - name: Test Bucket
        shell: powershell
        env:
          # Scoop's bucket tests validate changed JSON against the app manifest
          # schema, and the changed-file lookup is not scoped to bucket/, so it
          # also picks up config files such as .github/renovate.json. Clearing
          # CI selects the discovery branch that enumerates bucket/ directly.
          CI: ''
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
  test_pwsh:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          fetch-depth: 2
          path: my_bucket
      - name: Checkout Scoop
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Init Test Suite
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers
          shell: pwsh
      - name: Test Bucket
        shell: pwsh
        env:
          # Scoop's bucket tests validate changed JSON against the app manifest
          # schema, and the changed-file lookup is not scoped to bucket/, so it
          # also picks up config files such as .github/renovate.json. Clearing
          # CI selects the discovery branch that enumerates bucket/ directly.
          CI: ''
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
